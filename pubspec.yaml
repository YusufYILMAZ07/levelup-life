name: levelup_life
description: "CEYYUS · Yusuf & Ceyda ortak hayatını seviye atlatan çift uygulaması."
publish_to: 'none'
version: 6.4.0+10

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^18.0.1
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^9.2.4
  flutter_timezone: ^4.1.1
  http: ^1.2.2
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  onesignal_flutter: ^5.2.8
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.8.3
  timezone: ^0.10.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # CEYYUS marka görselleri: ikon + açılış ekranı üretimi.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

# ── CEYYUS uygulama ikonu ──────────────────────────────────────────────────
# Üretim: python3 tool/generate_ceyyus_icon.py
# Uygulama: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/ceyyus_icon.png"
  adaptive_icon_background: "#1B1033"
  adaptive_icon_foreground: "assets/icon/ceyyus_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/ceyyus_icon_monochrome.png"
  min_sdk_android: 23
  web:
    generate: true
    image_path: "assets/icon/ceyyus_icon.png"
    background_color: "#1B1033"
    theme_color: "#4F46E5"

# ── CEYYUS açılış (splash) ekranı ─────────────────────────────────────────
# Üretim: python3 tool/generate_ceyyus_icon.py
# Uygulama: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F8FAFC"
  color_dark: "#141026"
  image: "assets/icon/ceyyus_splash.png"
  image_dark: "assets/icon/ceyyus_splash.png"
  android: true
  ios: true
  web: true
  android_12:
    image: "assets/icon/ceyyus_splash.png"
    icon_background_color: "#1B1033"
    color: "#F8FAFC"
    color_dark: "#141026"
